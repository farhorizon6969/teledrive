name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: linux
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: darwin
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: windows
            arch: amd64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/teledrive${{ matrix.ext }} ./cmd/teledrive

      - name: Package archive
        id: package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PKG_NAME="teledrive-${TAG_NAME}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd bin && zip -9 ../dist/${PKG_NAME}.zip teledrive${{ matrix.ext }} && cd ..
            echo "asset=dist/${PKG_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czvf dist/${PKG_NAME}.tar.gz -C bin teledrive${{ matrix.ext }}
            echo "asset=dist/${PKG_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: teledrive-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
