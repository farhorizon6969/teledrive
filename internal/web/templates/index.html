<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleDrive - Cloud Storage</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <span>⚡</span>
            <span>TeleDrive</span>
        </div>
        <div class="search-bar">
            <input type="text" class="search-input" id="search-box" placeholder="Search files in TeleDrive..." oninput="handleSearch(this.value)">
        </div>
        <div>
            <a href="/logout" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Logout</a>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">
                <span>➕</span>
                <span>Upload File</span>
            </button>
            <input type="file" id="file-input" multiple style="display: none;">

            <button class="btn-upload" style="background: var(--bg-tertiary);" onclick="createFolderPrompt()">
                <span>📁</span>
                <span>New Folder</span>
            </button>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 8px 0;">

            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                <p><strong>Storage Backend:</strong></p>
                <p>Telegram MTProto (Safe Mode)</p>
                <p style="margin-top: 8px;"><strong>Vault Channel:</strong></p>
                <p>Private & Isolated</p>
            </div>
        </aside>

        <main class="content-area">
            <div id="dropzone" class="dropzone">
                <p>📁 Drag and drop files anywhere here to upload to Telegram</p>
            </div>

            <div id="upload-progress" style="display: none; margin-bottom: 20px;">
                <p id="upload-status" style="font-size: 0.85rem; color: var(--text-secondary);"></p>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>

            <nav id="breadcrumbs" class="breadcrumbs"></nav>

            <div class="section-title">Folders</div>
            <div id="folders-grid" class="grid"></div>

            <div class="section-title">Files</div>
            <div id="files-grid" class="grid"></div>
        </main>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 id="preview-title" style="font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></h3>
                <button class="btn-icon" style="font-size: 1.2rem;" onclick="closePreview()">✕</button>
            </div>
            <div id="preview-content"></div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 480px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3>Create Share Link</h3>
                <button class="btn-icon" onclick="closeShareModal()">✕</button>
            </div>
            <p id="share-file-name" style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px;"></p>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">Password Protection (Optional)</label>
                    <input type="password" id="share-password" class="search-input" placeholder="Leave empty for no password">
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">Link Expiration</label>
                    <select id="share-expiry" class="search-input" style="background: var(--bg-primary);">
                        <option value="0">Never expires</option>
                        <option value="1">1 day</option>
                        <option value="7" selected>7 days</option>
                        <option value="30">30 days</option>
                    </select>
                </div>
                <button class="btn-upload" onclick="createShareLink()" style="margin-top: 8px;">Generate Link</button>

                <div id="share-result" style="display: none; margin-top: 12px;">
                    <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">Public URL</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="share-link-input" class="search-input" readonly>
                        <button class="btn-upload" style="white-space: nowrap;" onclick="copyShareLink()">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        async function handleSearch(query) {
            if (!query.trim()) {
                loadDriveContent();
                return;
            }
            const res = await fetch(`/api/files?search=${encodeURIComponent(query)}`);
            const files = await res.json();
            renderFiles(files || []);
        }
    </script>
</body>
</html>
